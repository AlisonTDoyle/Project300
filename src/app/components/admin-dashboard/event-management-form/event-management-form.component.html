<div class="container">
    <form [formGroup]="eventForm">
        <div class="mb-2">
            <label class="form-label">Start Time</label>
            <input type="time" class="form-control" formControlName="StartTime">
        </div>
        <div class="mb-2">
            <label class="form-label">End Time</label>
            <input type="time" class="form-control" formControlName="EndTime">
        </div>
        <div class="mb-2">
            <label class="form-label">Day</label>
            <select class="form-select" formControlName="Day">
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
            </select>
        </div>
        <div class="mb-2">
            <label class="form-label">Semester</label>
            <select class="form-select" formControlName="Semester">
                <option>Winter</option>
                <option>Summer</option>
            </select>
        </div>
        <div class="mb-2">
            <label class="form-label">Module Code</label>
            <input type="text" class="form-control" formControlName="ModuleCode">
        </div>
        <div class="mb-2">
            <label class="form-label">Student Group</label>
            <input type="text" class="form-control" formControlName="StudentGroup" list="studentGroups">
            <datalist id="studentGroups">
                <option *ngFor="let group of studentGroups" value="{{group.StudentGroup}}">{{group.StudentGroup}}</option>
            </datalist>
        </div>
        <div class="mb-2">
            <label class="form-label">Staff Member</label>
            <input type="text" class="form-control" formControlName="StaffId">
        </div>
        <div class="mb-2">
            <label class="form-label">Room Number</label>
            <input type="text" class="form-control" list="rooms" formControlName="RoomNo">
            <datalist id="rooms">
                <option *ngFor="let room of rooms" value="{{room.RoomNo}}">{{room.RoomNo}}</option>
            </datalist>
        </div>
        <p class="text-danger">
            <span *ngFor="let conflict of eventConflicts">
                {{ conflict }}<br>
            </span>
        </p>
        <button type="button" (click)="onSubmit()" class="btn btn-primary w-100">Create Event</button>
    </form>
</div>
