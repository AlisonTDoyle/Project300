        body {

        }

        }

        /* For when the screen size gets smaller */
        /*****************************************/
        @media (max-width: 768px) {
            .greeting {
                font-size: 1em;
                padding: 10px 5px;
            }

            th,
            td {
                padding: 4px;
                font-size: 0.8em;
            }

            .timetable-container {
                padding: 10px 5px;
                overflow-x: auto;
            }

            table {
                font-size: 0.8em;
            }
        }

        /* For when the screen size gets REALLY small */
        /**********************************************/
        @media (max-width: 480px) {
            header {
                flex-direction: column;
                padding: 5px;
            }

            .greeting {
                font-size: 0.9em;
            }

            th,
            td {
                padding: 2px;
                font-size: 0.7em;
            }

            table {
                width: 100%;
                table-layout: fixed;
            }
        }
    </style>

    <!-- Greeting the User -->
    <!----------------------->
    <div class="greeting" style="text-align: center;"> <h3>Hello Jake!</h3> </div>
    
    <br/><br/>

    <!-- Sidebar to select timetable-->
    <!------>
    <div class="container-fluid h-100 timetable-container">
        <div class="row my-2">
            <div class="col-2">
                <div class="card">
                    <div class="container">
                        <div class="input-group my-3">
                            <input type="text" class="form-control" placeholder="Search Student Group" 
                                aria-label="Recipient's username" aria-describedby="basic-addon2" searchEnabled="true" #filter>
                            <button class="btn btn-primary" id="basic-addon2" type="button" (click)="onSearch(filter.value)"><span class="bi bi-search"></span></button>
                        </div>
                        <hr>
                        <div style="max-height: 80vh; overflow-y: auto;">
                            @if (studentGroups.length > 0) {
                                <div class="card mb-2 student-group-card" *ngFor="let group of studentGroups"
                                    (click)="StudentGroupClicked(group)"
                                    [ngClass]="{'selected': group === selectedStudentGroup}">
                                    <div class="card-body p-2">
                                        <p class="mb-0">{{group.StudentGroup}}</p>
                                    </div>
                                </div>
                                }
                                @else {
                                <div class="card-body p-2">
                                    <p class="mb-0">No student groups</p>
                                </div>
                                }
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-11">
                <div class="card p-2">
                        <full-calendar class="h-100" style="max-height: 60vh;" #programPreview [options]="calendarOptions" [events]="schedule"></full-calendar>
                </div>
            </div>
            <div class="col-2">
            </div>
        </div>
    </div>

    <!-- Calling the Timetable -->
    <!--------------------------->

    <full-calendar class="h-100" style="max-height: 60vh;" #programPreview [options]="calendarOptions" [events]="schedule"></full-calendar>

    <!-- File Select -->
    <!----------------->
    <div style="text-align: right; margin: 20px;">
        <label for="fileInput" class="btn btn-primary">Import Schedule</label>
        <input id="fileInput" type="file" accept=".json" style="display: none;" (change)="importSchedule($event)">
    </div>

    <!-- Display the Upcoming Subject -->
    <!---------------------------------->
    <div style="text-align: center;">
        <h4><u>{{ upcomingSubject }}</u></h4>
    </div>

    <footer class="py-3 my-4">
        <p class="text-center text-light">© 2024 Atlantic Technological University</p>
    </footer>
      
    <br/>

</body>
